<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        
        function greet(name){
             name ? 
            console.log(`Hello ${name}`) : console.log('hi there ');
        }
        greet('simon');
        greet('ganesh');
        greet();

        function convertToFahrenheit(celsius){
            let fahrenheit= (celsius*(9/5))+32;
            console.log(`celsius to fahrenheit:${fahrenheit}F`);
        }
        
        function convertToCelsius(fahrenheit){
             let celsius= (fahrenheit-32)*5/9;
            console.log(` fahrenheit to celsius:${celsius}C`);
        }
        function convertTemperature(degree,unit){
            if(unit==='C'){
                convertToCelsius(degree);
            }
            else if (unit==='F'){
                convertToFahrenheit(degree);
            }
            else{
                console.log('please enter convert unit of degree.');
            }
        }
        convertToFahrenheit(25);
        convertToCelsius(86);
        convertTemperature(82,'F');
        
        function convertLength(length,from,to){
            if(from==='miles' && to==='km'){
                console.log(`miles to km :${length*1.6} KM`);
            }
            else if(from==='km' && to ==='miles'){
                console.log(`km to miles:${length/1.6}miles`);
            }
            else if(from==='km' && to ==='km'){
                console.log(`km to km :${length}km`);
            }
             else if(from==='km' && to ==='ft'){
                console.log(`km to ft :${length*3281}ft`);
            }
            if(from==='miles' && to==='ft'){
                console.log(`miles to ft :${length*5280} ft`);
            }
            else{
                console.log('please enter valid entry.');
            }
        }

        convertLength(50,'miles','km');
        convertLength(32,'km','miles');
        convertLength(50,'km','km');
        convertLength(5,'miles','ft');
        convertLength(5,'miles','ft');
        convertLength(5,'km','ft');
        convertLength(5,'kds','mil');
    </script>
</body>
</html>
