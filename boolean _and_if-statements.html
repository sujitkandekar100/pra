<!DOCTYPE html>
<html lang="en">
<head>
    <title>boolean</title>
</head>
<body>
    <script>
      
      let time = new Date();
      let hour = time.getHours();
      console.log('Hour:',hour)
      if(6<hour<12){
        console.log('Good Morning!');
      }
      else if(13<hour<17)
      {
        console.log('Good afternoon!');
      }
       else{
        console.log('Good night!');
       }
    </script>
    
</body>
</html>
