<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>arrayandloop</title>
</head>
<body>
    <script>
     let index=0;
     const arraywords=['hello','world','search','good','search'];
     //const arraywords=['not','found'];
     for(let i=0;i<arraywords.length;i++){
        if(arraywords[i]=== 'search'){
            index++;
        }
     }
      console.log(index);
      console.log('******************');
      function findIndex(array,word){
          let index2 = -1;
          for(let i=0;i<array.length;i++){
            if(word===array[i]){
                index2++;
            }
          }
          console.log(index2);
      }
      findIndex(['green','red','blue','red'],'red');
      findIndex(['green','red','blue','red'],'yellow');
      const result=[];
       let eggremove=0;
      function removeEgg(foods){
        for(let i=0;i<foods.length;i++){
            if(foods[i]==='egg' && eggremove<2 ){
                eggremove++;
                continue;
            }
            result.push(foods[i]);
        }
        return result;
      }
      console.log(removeEgg(['egg','apple','egg','egg','ham']));
    </script>
</body>
</html>
