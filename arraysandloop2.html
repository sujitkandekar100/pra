<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>arrayandloop</title>
</head>
<body>
    <script>
     let index=0;
     const arraywords=['hello','world','search','good','search'];
     //const arraywords=['not','found'];
     for(let i=0;i<arraywords.length;i++){
        if(arraywords[i]=== 'search'){
            index++;
        }
     }
      console.log(index);
      
    </script>
</body>
</html>
