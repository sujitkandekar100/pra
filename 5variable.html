<!doctype html>
<html lang="en">
<head>
  
    <title>5variable</title>
   
</head>
<body>
    
    <button onclick="addFour(Number(+4))">+4</button>
    <button onclick="addFour(5)">+5</button>
     <button onclick="minus(2)">-2</button>
     <button onclick="minus(3)">-3</button>
    <script>
     const name ='ganesh';
     console.log(`My name is:$${name}`);
     const total_cost = Number((1*5)+(2*3)+(1*9));
     console.log(`Cost of Food:$${total_cost}`);
     const tax=total_cost*0.10;
     console.log(`Tax(10%):$${tax}`);
     const total_price=Number(total_cost+tax);
     console.log(`Total cost:$${total_price}`);
     let result=0;
    function addFour(value_enter){
       result+=value_enter;
       console.log(result);
    }
    function minus(value_enter){
        result-=value_enter;
        console.log(result);
    }
    </script>
</body>
</html>
