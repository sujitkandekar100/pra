<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
        <p>Amazon Calculator</p>
    </div>
    <input class="js-input" placeholder="Cost Of Order" onkeydown="handleCostKeydown(event);"/>
    <button onclick="calculateTotal();">Calculate</button>
    <p class="js-total-cost"></p>
    <script>
       function handleCostKeydown(event){
         if(event.key === 'Enter'){
            calculateTotal();
         }
       }
       function calculateTotal(){
        let inputElement= document.querySelector('.js-input');
        let inputvalue=Number(inputElement.value)*100;
        if(inputvalue<4000){
            inputvalue=inputvalue+100;
            console.log(typeof(inputvalue));
        }
        document.querySelector('.js-total-cost').innerHTML=`shiping cost :$${inputvalue/100}`;
       }
    </script>
</body>
</html>
