<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document object model </title>
</head>
<body>
    <button>9a</button>
    <button class="button-9b">9b</button>
    <script>
        const button = document.querySelector('button');
        console.log(button);
        document.querySelector('.button-9b').innerText="9b Done!";
    </script>
</body>
</html>
