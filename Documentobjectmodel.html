<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document object model </title>
</head>
<body>

    <div>
        <p>
            <button>9a</button>
            <button class="button-9b">9b</button>
        </p>
        <p>
           <button class="button-head" onclick="document.querySelector('.js-choice').innerHTML='You choose : heads';">heads</button>
           <button class="button-tails" onclick="document.querySelector('.js-choice').innerHTML='You choose: tails';">tails</button>
        </p>
        <p class="js-choice"></p>
        <p>
            <input placeholder="Name" class="js-name-input"
      onkeydown="
        if (event.key === 'Enter') {
          // Optional: instead of duplicating this code,
          // you could also put it in a function.
        showMessage()
        }"/>
        </br>
            <button onclick="
           showMessage()">Submit</button>
        </p>
        <p class="js-name"></p>
    </div>
    <script>
        const button = document.querySelector('button');
        console.log(button);
        document.querySelector('.button-9b').innerText="9b Done!";
        function showMessage(){
              const inputElement = document.querySelector('.js-name-input');
          document.querySelector('.js-name')
            .innerHTML = `Your name is: ${inputElement.value}`;
        }
    </script>
</body>
</html>
