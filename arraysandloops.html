</head>
<body>
    <script>
        const nums = [10,20,30];
        nums[2]=99;
        console.log(nums);
        function getLastValue(array){
           return array[array.length-1];
        }
       console.log(getLastValue([1,20,22,24,5])) ;
      console.log( getLastValue(['hi','hello','good']));
      function arraySwap(array){
        let firstelement=array[0];
       array[0]= array[array.length-1];
       array[array.length-1]=firstelement;
       console.log(array);
      }
      arraySwap([1,20,22,24,5]);
      arraySwap(['hi','hello','good']);
      for(let i=0;i<=10;i++){
        if(i%2===0){
          console.log(i);
        }
      };

      for(let i=5;i>0;i--){
        console.log(i);
      };
     console.log('*****************');
    let i=0;
    while(i<10){
        if(i%2===0){
           console.log(i);
        }
        i++;
    };
    console.log('###############');
    let j=5;
    while(j>0){
        console.log(j);
        j--;
    };
    console.log('@@@@@@@@@@@@@@@@@@@');
    const arrayloop=[1,2,3];
    for(let i=0;i<arrayloop.length;i++){
        arrayloop[i]+=1;
    }
    console.log(arrayloop);
    function addOne(array){
        for(let i=0;i<array.length;i++){
            array[i]+=1;
        };
        return array;
    };
    addOne(arrayloop);
    addOne([-2,-1,0,99]);
    function addNum(array,num){
        for(let i=0;i<array.length;i++){
            array[i]+=num;
        }
        return array;
    }
    addNum([1,2,3],2);
    addNum([1,2,3],3);
    addNum([-2,-1,0,99],2);
    console.log('------------------------');

    function addArrays(array1,array2){
          let arraylength=array1.length;
          const arraythird=[];
          for(let i=0;i<arraylength;i++){
            arraythird[i]=array1[i]+array2[i];
          }
          console.log(arraythird);
    }
    addArrays([1,1,2],[1,1,3]);
    addArrays([1,2,3],[4,5,6]);
    console.log('++++++++++++++++++++');

    function countPositive(nums){
       let countnumber=0;
       for(let i=0;i<nums.length;i++){
        if(nums[i]>0){
          countnumber++;
        }
       }
       console.log(countnumber);
    }
    countPositive([1,-3,5]);
    countPositive([-2,3,-5,7,10]);
    </script>
