<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>object</title>
</head>
<body>
    <script>
        const product = {
            productName: 'basketball',
            price: 2095,
            'delivery-time': '3 days'
        };
        product.price = 2595;
        console.log(product);
        
        const product1 = {
            name:'ball',
            price:2000
        }
        const product2 = {
            name:'tenis',
            price:1999
        }
        function comparePrice(product1,product2){
           return product1.price<product2.price ? product1.name : product2.name;
        }
        console.log(`okay this product less expensive:${comparePrice(product1,product2)}`);

        function isSameProduct(product1,product2){
           return product1.name ===  product2.name && product2.price === product2.price ? 'it is same product.' : 'both us not same.';
        }
        console.log(isSameProduct(product1,product2));
        console.log((product1.name).toLowerCase());
    </script>
</body>
</html>
