<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .toggle-button {
        background-color: rgb(230, 230, 230);
        border: none;
        padding: 10px 15px;
        border-radius: 5px;
        margin-right: 10px;
        font-size: 15px;
        cursor: pointer;
      }

      .is-toggled {
        background-color: black;
        color: white;
      }
    </style>
</head>
<body>
    <div>
       <p>
        <button style="background-color: yellow; border-radius: 15%; padding: 10%; color: black;">Add to Cart</button>
       </p>    
       <p>
        <button style="background-color: black; color: white; border-radius: 10%; padding: 10%;">Request Now</button>
        </p>
    </br>
        <button style="background-color: antiquewhite; color: black; border-radius: 10%; padding: 10%;">Schedule for Later</button>
       </p>    
       <button class="js-button1">Test</button>
       <button class="toggle-button js-button" onclick="
       const button1= document.querySelector('.toggle-button');
       if(!button1.classList.contains('is-toggled')){
        button1.classList.add('is-toggled');
       }
       else{
        button1.classList.remove('is-toggled');
       }">Gaming</button>
    </div>
    <script>
     const button = document.querySelector('.js-button1');
     button.classList.add('new-class');
     
     // Check if button has the class 'js-button1'
     const hasClass = button.classList.contains('js-button1');
     console.log(hasClass);
    </script>
</body>
</html>
