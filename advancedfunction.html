<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>advancefunction</title>
</head>
<body>
       <button class="js-finish-button" onclick="finish()">Finish</button>
       <button class="js-button-cart" onclick="addcart()">Add to Cart</button>
       <p class="js-paragraph-cart"></p>
    <script>
        const add= function () {
            console.log(2+3);
        };
        add();
        add();
        function runTwice(fun) {
            fun();
            fun();
        }
        
        // Test runTwice with the add function
        runTwice(add);
        
        // Test runTwice with an anonymous function
        runTwice(function () {
            console.log('12b');
        });
        function finish(){
            const button = document.querySelector('.js-finish-button');
            button.innerHTML='Loading';
            setTimeout(()=>{
             button.innerHTML='Finshed!';
            },5000);
        };
         let timeoutId;
         function addcart(){
            const messageParagraph=document.querySelector('.js-paragraph-cart');
            messageParagraph.innerHTML='Added';
            clearTimeout(timeoutId);
          timeoutId= setTimeout(()=>{
          messageParagraph.innerHTML='';
         },2000);
          
        };
        setInterval(()=>{
            document.title='new message';
        },1000);
       
        
    </script>
</body>
</html>
