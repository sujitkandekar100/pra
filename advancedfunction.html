<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>advancefunction</title>
</head>
<body>
    
    <script>
        const add= function () {
            console.log(2+3);
        };
        add();
        add();
        function runTwice(fun) {
            fun();
            fun();
        }
        
        // Test runTwice with the add function
        runTwice(add);
        
        // Test runTwice with an anonymous function
        runTwice(function () {
            console.log('12b');
        });
    </script>
</body>
</html>
